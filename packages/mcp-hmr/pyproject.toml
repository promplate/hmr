[project]
name = "mcp-hmr"
description = "Hot Reloading for MCP Servers"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "hot-reload", "hmr", "reload", "server"]
authors = [{ name = "Muspi Merol", email = "me@promplate.dev" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "hmr~=0.7.0",
]
dynamic = ["version"]

# `fastmcp` pins `mcp<2`, so depending on it unconditionally would rule out mcp 2.x forever
[project.optional-dependencies]
fastmcp = ["fastmcp>=2.12,<4"]
mcp = ["mcp>=1,<3"]

[tool.pdm.version]
source = "file"
path = "mcp_hmr.py"

[project.scripts]
mcp-hmr = "mcp_hmr:cli"

[project.urls]
Homepage = "https://github.com/promplate/hmr"
Documentation = "https://hmr.promplate.dev"
Repository = "https://github.com/promplate/hmr/tree/HEAD/packages/mcp-hmr"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
