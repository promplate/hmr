[project]
name = "sglang-cpu-hmr-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sglang-hmr"]

# SGLang's own general-plugin group. `load_plugins()` runs in the listener and in
# every scheduler child, so the probe reaches the process that owns the model.
[project.entry-points."sglang.srt.plugins"]
hmr_sglang_probe = "hmr_sglang_probe:register_hooks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hmr_sglang_probe"]

[tool.pytest.ini_options]
# `smoke` and `mutations` are top-level modules in this directory, not an installed package.
pythonpath = ["."]
testpaths = ["tests"]
